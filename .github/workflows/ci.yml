name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Required: typecheck and the tests for finished code. No database, network or API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:core

  progress:
    # Informational: runs the TODO specs (red until you finish them) and writes a
    # progress table to the run summary. It never fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/progress.mjs --specs >> "$GITHUB_STEP_SUMMARY"
